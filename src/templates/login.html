<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SSO Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #111827; padding: 32px; border-radius: 12px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; margin-top: 16px; font-size: 14px; color: #cbd5e1; }
    input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #334155; background: #0b1220; color: #e2e8f0; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg,#06b6d4,#22d3ee); color: #0b1220; font-weight: 700; cursor: pointer; }
    .error { margin-top: 12px; color: #f87171; font-size: 14px; }
    small { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Accede a tu cuenta</h1>
    <form id="loginForm" method="POST" action="/login" data-mode="{{MODE_ATTR}}">
      <label>Usuario</label>
      <input type="text" name="username" placeholder="usuario" required />
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required />
      {{NEXT_HIDDEN}}
      <button type="submit">Continuar</button>
      <div id="formError" class="error">{{ERROR_HTML}}</div>
      <small>Tu sesión SSO se aplicará al flujo OAuth2/OIDC en curso.</small>
    </form>
  </div>
  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("formError");
    const mode = form?.dataset?.mode || "cookie";
    function clearLoginFields() {
      const username = form?.querySelector('input[name="username"]');
      const password = form?.querySelector('input[name="password"]');
      if (username) username.value = "";
      if (password) password.value = "";
    }

    function showError(message) {
      if (!errorBox) return;
      errorBox.textContent = message;
      if (window.parent) {
        window.parent.postMessage(
          { type: "sso-login-error", message },
          "*"
        );
      }
    }

    function tryRedirectParent() {
      if (!document.referrer) return;
      try {
        const ref = new URL(document.referrer);
        if (ref.protocol !== "http:" && ref.protocol !== "https:") return;
        window.parent.location.href = `${ref.origin}/private.html`;
      } catch (err) {
        // ignore
      }
    }

    clearLoginFields();

    if (form) {
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const payload = {
          username: formData.get("username"),
          password: formData.get("password"),
        };
        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(payload),
          });
          const text = await response.text();
          const data = text ? JSON.parse(text) : {};
          if (!response.ok) {
            showError(data.error || "Credenciales inválidas");
            return;
          }
          const nextInput = form.querySelector('input[name="next"]');
          const nextValue = nextInput ? nextInput.value : "";
          const nextTarget = nextValue ? decodeURIComponent(nextValue) : "";
          const inIframe = window.parent && window.parent !== window;
          if (mode === "token" && inIframe) {
            window.parent.postMessage(
              { type: "sso-login-token", ...data },
              "*"
            );
            tryRedirectParent();
          } else if (nextTarget && nextTarget.startsWith("/")) {
            window.location.href = nextTarget;
          } else {
            window.location.href = "/";
          }
        } catch (err) {
          showError("No se pudo conectar al servidor");
        }
      });
    } else if (errorBox && errorBox.textContent.trim()) {
      showError(errorBox.textContent.trim());
    }
  </script>
</body>
</html>
