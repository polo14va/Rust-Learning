<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSO Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <main class="login-shell">
    <section class="login-card" data-reveal>
      <p class="eyebrow">OAuth2 / OIDC</p>
      <h1>Acceso profesional</h1>
      <p class="lead">Inicia el flujo Authorization Code + PKCE. El servidor mantiene SSO con cookies seguras.</p>
      <button id="btnStartAuth" class="btn">Login con SSO</button>
      <p id="loginError" class="error hidden"></p>
    </section>
  </main>
</body>
</html>
