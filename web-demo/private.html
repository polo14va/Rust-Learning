<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSO Private</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <main class="private-shell">
    <section class="private-card" data-reveal>
      <header class="private-header">
        <div>
          <p class="eyebrow">SSO / OAuth2 / OIDC</p>
          <h1>Acceso privado</h1>
          <p class="lead">Validamos tu token con el servidor y listamos permisos activos.</p>
        </div>
        <button id="btnLogout" class="btn ghost">Cerrar sesión</button>
      </header>

      <div class="status-bar">
        <span id="accessStatus" class="status-pill">Verificando acceso...</span>
        <span id="audienceInfo" class="status-pill ghost">audiencia: -</span>
        <span id="expiresInfo" class="status-pill ghost">expira: -</span>
      </div>
      <p id="privateError" class="error hidden"></p>

      <div class="private-grid">
        <article class="card">
          <h2>Identidad</h2>
          <div class="info-list">
            <div class="info-item"><span>Usuario</span><strong id="userName">-</strong></div>
            <div class="info-item"><span>Email</span><strong id="userEmail">-</strong></div>
            <div class="info-item"><span>Rol</span><strong id="userRole">-</strong></div>
            <div class="info-item"><span>Cliente</span><strong id="clientId">-</strong></div>
          </div>
        </article>

        <article class="card">
          <h2>Permisos (scope)</h2>
          <ul id="scopeList" class="scope-list"></ul>
        </article>

        <article class="card">
          <h2>Estado</h2>
          <div class="info-list">
            <div class="info-item"><span>/userinfo</span><strong id="userinfoStatus">-</strong></div>
            <div class="info-item"><span>/dashboard</span><strong id="dashboardStatus">-</strong></div>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
